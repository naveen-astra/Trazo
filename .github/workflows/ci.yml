# CI (TRZ-P0-05). Path-filtered per lane so dashboard-only PRs skip Python
# jobs (DEVELOPMENT_GUIDE §5). Contract tests run as part of the normal
# pytest suite (test_events_contract.py, both packages); integration tests
# run against the postgres/redis service containers below and self-skip
# gracefully if a runner ever lacks them (TRZ-P1-02/05/09).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      policies: ${{ steps.filter.outputs.policies }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'sdk/**'
              - 'control-plane/**'
              - 'schema/**'
              - 'demos/**'
              - 'benchmark/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'
            policies:
              - 'policies/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trazo
          POSTGRES_PASSWORD: trazo
          POSTGRES_DB: trazo
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U trazo -d trazo"
          --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TRAZO_DATABASE_URL: postgresql://trazo:trazo@localhost:5432/trazo
      TRAZO_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # schema-freeze check below diffs against origin/main
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff, repo-wide)
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Schema freeze check (no drift without a version bump)
        run: |
          git show origin/main:schema/trace-event.v1.schema.json > /tmp/schema-before.json 2>/dev/null || echo '{}' > /tmp/schema-before.json
          python scripts/check_schema_version_bump.py /tmp/schema-before.json schema/trace-event.v1.schema.json
      - name: Debt-marker check (every marker links a real task ID)
        run: python scripts/check_debt_comments.py
      - name: SDK — sync, typecheck, test
        working-directory: sdk
        timeout-minutes: 10
        run: |
          uv sync --dev --all-extras
          uv run mypy
          uv run pytest
      - name: Demos — cassette tests + fixture-mode smoke (zero API cost)
        # No TRAZO_DEMO_API_KEY/OPENAI_API_KEY is set here on purpose:
        # this asserts the default (non---live) path never needs one
        # (TRZ-P3-04's DoD). --endpoint points at a closed port so each
        # demo spools instead of failing (Shipper's documented fallback,
        # same as a real unreachable control plane).
        working-directory: sdk
        run: |
          uv run pytest ../demos/_shared -q
          uv run python ../demos/research-assistant/run.py --endpoint http://localhost:1
          uv run python ../demos/content-pipeline/run.py --endpoint http://localhost:1
      - name: Benchmark scripts — corpus/fidelity/replay unit tests
        # Stdlib-only test subjects (benchmark/corpus, benchmark/fidelity)
        # but run through the sdk venv's own pytest — a bare `python -m
        # pytest` here would hit whatever interpreter astral-sh/setup-uv
        # put on PATH, which has no pytest installed at all.
        run: uv run --project sdk pytest benchmark/ -q
      - name: Replay integration check (both demo frameworks, zero live calls)
        # Runs each demo for real, converts its spool straight into a
        # replay bundle (no control plane needed), replays it, and
        # asserts zero divergence + full fidelity (TRZ-P4-08) — the
        # thing that actually proves the replay engine works against
        # real LangGraph/CrewAI adapters, not just Substituter unit tests.
        run: uv run --project sdk python scripts/replay/verify_fidelity.py all
      - name: Control plane — sync, typecheck, test
        # A run against the real postgres/redis service containers above
        # hung silently here for 4+ hours (no output was ever flushed
        # under pytest's default stdout buffering, so nothing distinguished
        # it from a slow run until it was manually canceled) -- this
        # step-level ceiling, plus pytest-timeout's per-test bound
        # (control-plane/pyproject.toml), stop a repeat from burning the
        # runner for anywhere near GitHub's own 6h job ceiling.
        working-directory: control-plane
        timeout-minutes: 10
        run: |
          uv sync --dev
          uv run mypy
          uv run pytest

  opa:
    needs: changes
    if: needs.changes.outputs.policies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        # Pinned to the same version deploy/docker-compose.yml's opa
        # service runs, so a passing test here means the exact binary
        # production uses actually accepts this bundle.
        run: |
          curl -sL -o /usr/local/bin/opa \
            https://github.com/open-policy-agent/opa/releases/download/v0.70.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: opa test
        run: opa test policies/trazo policies/tests/trazo -v

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install, lint, build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run format
          npm run build

  pr-title:
    # Squash-merge uses the PR title as the commit; enforce conventional
    # commits + task-ID convention (DEVELOPMENT_GUIDE §6) at the door.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
