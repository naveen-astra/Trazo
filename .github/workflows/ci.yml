# CI (TRZ-P0-05). Path-filtered per lane so dashboard-only PRs skip Python
# jobs (DEVELOPMENT_GUIDE §5). Contract and integration jobs are added with
# Phase 1 (TRZ-P1-02/05) once there is a schema and a compose-backed test.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'sdk/**'
              - 'control-plane/**'
              - 'schema/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff, repo-wide)
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: SDK — sync, typecheck, test
        working-directory: sdk
        run: |
          uv sync --dev
          uv run mypy
          uv run pytest
      - name: Control plane — sync, typecheck, test
        working-directory: control-plane
        run: |
          uv sync --dev
          uv run mypy
          uv run pytest

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install, lint, build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run format
          npm run build

  pr-title:
    # Squash-merge uses the PR title as the commit; enforce conventional
    # commits + task-ID convention (DEVELOPMENT_GUIDE §6) at the door.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
