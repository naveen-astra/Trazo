# Nightly jobs (TRZ-P0-05). Unimplemented ones are placeholders that fail
# loudly if their phase has closed without wiring them up:
#   smoke            — highest closed phase's scripts/smoke/phaseN.sh (P0+)
#   adapter-matrix   — LangGraph/CrewAI min+latest versions (TRZ-P3-06)
#   overhead         — SDK <=10% wall-clock benchmark (TRZ-P2-09) — wired
#   corpus           — demo-agent trace generation (TRZ-P3-05)
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 smoke (compose stack boots)
        run: |
          cp deploy/.env.example deploy/.env
          bash scripts/smoke/phase0.sh

  overhead:
    # SDK instrumentation overhead vs the toy LangGraph agent
    # (sdk/tests/agents/research_assistant.py), asserted against
    # MASTER_PLAN.md's <=10% wall-clock budget (TRZ-P2-09). Exits non-zero
    # — turning this job red — the moment the budget is blown.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: SDK — sync
        working-directory: sdk
        run: uv sync --dev --extra langgraph
      - name: Overhead benchmark (toy agent, ±SDK)
        working-directory: sdk
        run: uv run python -m benchmark.agent_overhead
