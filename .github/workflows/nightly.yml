# Nightly jobs (TRZ-P0-05). Unimplemented ones are placeholders that fail
# loudly if their phase has closed without wiring them up:
#   smoke            — highest closed phase's scripts/smoke/phaseN.sh (P0+)
#   adapter-matrix   — LangGraph/CrewAI min+latest versions (TRZ-P3-06) — wired
#   overhead         — SDK <=10% wall-clock benchmark (TRZ-P2-09) — wired
#   corpus           — demo-agent trace generation (TRZ-P3-05) — wired, but
#                      self-skips until a TRAZO_DEMO_API_KEY (or
#                      OPENAI_API_KEY) repo secret is actually configured —
#                      see the job's own comment.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 smoke (compose stack boots)
        run: |
          cp deploy/.env.example deploy/.env
          bash scripts/smoke/phase0.sh

  adapter-matrix:
    # Confirms each framework adapter works across the *whole* declared
    # range in sdk/pyproject.toml's optional-dependencies (TRZ-P3-06), not
    # just whatever version happens to be locked day-to-day. "max" needs no
    # override: a plain `uv sync` already resolves to the highest version
    # satisfying the range, so it never goes stale as new releases land.
    # "min" pins down to the range's lower bound via a targeted
    # `uv pip install pkg==<min>` *after* a normal sync (not
    # `--resolution lowest-direct`, which was tried and rejected here: it
    # also drags trazo's own base deps — pydantic et al. — down to their
    # minimums, and pydantic==2.7's pydantic-core has no prebuilt wheel for
    # this runner, forcing a Rust build that fails outright — noise
    # unrelated to what this job is meant to catch).
    #
    # Bump the two `min` literals below only in lockstep with the matching
    # lower bound in sdk/pyproject.toml's `langgraph`/`crewai` extras.
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: langgraph
            version: min
            pin: "langgraph==1.2.3 langgraph-checkpoint==4.1.1 langgraph-sdk==0.4.4 langchain-core==1.4.0"
            tests: tests/test_langgraph_adapter.py tests/test_core_serialization.py
          - framework: langgraph
            version: max
            pin: ""
            tests: tests/test_langgraph_adapter.py tests/test_core_serialization.py
          - framework: crewai
            version: min
            pin: "crewai==1.15.0"
            tests: tests/test_crewai_adapter.py tests/test_crewai_listener_memory.py
          - framework: crewai
            version: max
            pin: ""
            tests: tests/test_crewai_adapter.py tests/test_crewai_listener_memory.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: SDK — sync (${{ matrix.framework }})
        working-directory: sdk
        run: uv sync --dev --extra ${{ matrix.framework }}
      - name: Pin to ${{ matrix.version }} version
        if: matrix.pin != ''
        working-directory: sdk
        run: uv pip install ${{ matrix.pin }}
      - name: Adapter tests (${{ matrix.framework }} ${{ matrix.version }})
        working-directory: sdk
        run: uv run pytest ${{ matrix.tests }} -v

  overhead:
    # SDK instrumentation overhead vs the toy LangGraph agent
    # (sdk/tests/agents/research_assistant.py), asserted against
    # MASTER_PLAN.md's <=10% wall-clock budget (TRZ-P2-09). Exits non-zero
    # — turning this job red — the moment the budget is blown.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: SDK — sync
        working-directory: sdk
        run: uv sync --dev --extra langgraph
      - name: Overhead benchmark (toy agent, ±SDK)
        working-directory: sdk
        run: uv run python -m benchmark.agent_overhead

  corpus-gate:
    # `secrets` is not available in a job-level `if`, so the key check runs
    # in a step here and the corpus job gates on its output.
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          TRAZO_DEMO_API_KEY: ${{ secrets.TRAZO_DEMO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$TRAZO_DEMO_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  corpus:
    # Runs both demos in --live mode (TRZ-P3-04) against a real, freshly
    # booted compose stack (same pattern as the `smoke` job), then archives
    # each run's run_id to benchmark/corpus/index.json and commits it back
    # — the task's DoD ("7 days of runs accumulated before P5 close") is
    # about that committed index, not about the stack's own Postgres data,
    # which does not persist once this job's runner is torn down (no
    # persistent control-plane deployment exists yet; that's a deploy/ops
    # concern outside this task's scope, not solved here).
    #
    # Self-skips (rather than going permanently red) until a real
    # TRAZO_DEMO_API_KEY or OPENAI_API_KEY repo secret is configured — ships
    # code-complete but not field-verified: no LLM API key was available
    # in the environment this was built in, so the actual `--live` network
    # path has never been run for real (see demos/_shared/README.md).
    needs: corpus-gate
    if: needs.corpus-gate.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TRAZO_DEMO_API_KEY: ${{ secrets.TRAZO_DEMO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Compose stack up
        run: |
          cp deploy/.env.example deploy/.env
          docker compose --project-name trazo-corpus --env-file deploy/.env \
            -f deploy/docker-compose.yml up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8420/healthz >/dev/null 2>&1 && break
            [ "$i" -eq 60 ] && echo "control plane never became healthy" >&2 && exit 1
            sleep 2
          done
      - name: SDK — sync (langgraph + crewai + demos)
        working-directory: sdk
        run: uv sync --dev --extra langgraph --extra crewai --extra demos
      - name: research-assistant — live run
        id: research_assistant
        working-directory: sdk
        run: |
          out=$(uv run python ../demos/research-assistant/run.py --live)
          echo "$out"
          run_id=$(echo "$out" | sed -n 's/^TRAZO_RUN_ID=//p')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: content-pipeline — live run
        id: content_pipeline
        working-directory: sdk
        run: |
          out=$(uv run python ../demos/content-pipeline/run.py --live)
          echo "$out"
          run_id=$(echo "$out" | sed -n 's/^TRAZO_RUN_ID=//p')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Archive run_ids to the corpus index
        run: |
          python benchmark/corpus/archive_run.py --project research-assistant \
            --framework langgraph --run-id "${{ steps.research_assistant.outputs.run_id }}"
          python benchmark/corpus/archive_run.py --project content-pipeline \
            --framework crewai --run-id "${{ steps.content_pipeline.outputs.run_id }}"
      - name: Commit the updated corpus index
        run: |
          git config user.name "trazo-bot"
          git config user.email "trazo-bot@users.noreply.github.com"
          git add benchmark/corpus/index.json
          git diff --staged --quiet || git commit -m "chore(corpus): archive nightly demo runs"
          git push
      - name: Compose stack down
        if: always()
        run: |
          docker compose --project-name trazo-corpus --env-file deploy/.env \
            -f deploy/docker-compose.yml down --volumes --remove-orphans
