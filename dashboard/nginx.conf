server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API path proxied to the control plane inside the compose network
    location /v1/ {
        proxy_pass http://control-plane:8420;
        proxy_set_header Host $host;
        # SSE endpoints need buffering off to stream
        proxy_buffering off;
        proxy_http_version 1.1;
    }
}
