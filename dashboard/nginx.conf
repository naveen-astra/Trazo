server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Vite fingerprints every asset filename by content, so they never change
    # under a given name and can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document must always be revalidated, or a deploy would keep
    # serving the previous build's asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API path proxied to the control plane inside the compose
    # network (used when the dashboard is built with VITE_API_BASE_URL="";
    # production routes /v1 at the edge proxy instead).
    location /v1/ {
        proxy_pass http://control-plane:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE endpoints need buffering off to stream
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 1h;
    }
}
