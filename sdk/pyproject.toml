[project]
name = "trazo"
version = "0.1.0.dev0"
description = "Observability, replay, and governance SDK for multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trazo maintainers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
langgraph = [
    # >=0.2.17, not bare >=0.2: langgraph<0.2.17 pins langchain-core<0.3
    # exclusively, which is incompatible with the langchain-core>=0.3
    # constraint below (verified against PyPI metadata, TRZ-P3-06).
    "langgraph>=0.2.17,<0.3",
    # langgraph's own declared range otherwise permits langchain-core as
    # low as 0.2.4x even at its newest 0.2.x release — that's still
    # pydantic-v1-style message classes with no `model_dump`, which
    # `trazo.core.serialization` depends on (confirmed by actually
    # installing langgraph==0.2.0 and running the adapter's tests against
    # it: state hashing silently degrades every LangChain message to
    # `$unrepresentable`). Pin the transitive dependency directly rather
    # than trust langgraph's range.
    "langchain-core>=0.3",
]
crewai = [
    "crewai>=1.15,<2",
]
# Framework adapters are optional extras; each range is pinned to the
# major version verified against when its adapter task landed
# (TRZ-P2-04: langgraph 0.2.76; TRZ-P3-01: crewai 1.15.6). TRZ-P3-06's
# nightly `adapter-matrix` job (.github/workflows/nightly.yml) verifies
# both ranges' min and max install and pass on every run, so this comment
# doesn't need hand-updating as new patch releases land within the range.
demos = [
    # demos/research-assistant's vector memory (TRZ-P3-02). A dedicated
    # extra, not folded into `langgraph` — chromadb isn't LangGraph-
    # specific, and other demos may need it without needing an adapter.
    "chromadb>=1.1,<2",
]

[project.scripts]
trazo = "trazo.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trazo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Same protective bound as control-plane/pyproject.toml, applied here
# proactively rather than after a real SDK-side hang (see that file's
# comment for the incident that motivated it).
timeout = 60

[tool.mypy]
strict = true
# Not a relaxation of trazo's own 3.10 support (requires-python above, and
# ruff's target-version = "py310" at the repo root, are what actually gate
# that): with both framework extras installed, langgraph's langsmith
# dependency imports pytest in its normal (non-test) code, which — now
# that crewai's chromadb dependency pulls numpy into the venv for the
# first time — reaches numpy's own stub using Python 3.12+ ``type``
# statement syntax. Stub files are always fully parsed by mypy regardless
# of follow_imports, so a parse error there is fatal to the whole run
# unless python_version allows that syntax.
python_version = "3.12"
mypy_path = "src"
packages = ["trazo"]
