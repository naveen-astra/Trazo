[project]
name = "trazo"
version = "0.1.0.dev0"
description = "Observability, replay, and governance SDK for multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trazo maintainers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Framework adapters are optional extras; version ranges are pinned when the
# adapter tasks land (TRZ-P2-04, TRZ-P3-01) — declaring ranges before the
# adapters exist would be a guess.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trazo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["trazo"]
