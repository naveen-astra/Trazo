[project]
name = "trazo"
version = "0.1.1"
description = "Observability, replay, and governance SDK for multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trazo maintainers" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
langgraph = [
    # >=1.2.3: the earliest release whose own dependency ranges can reach a
    # patched langgraph-sdk (1.0.10 through 1.2.2 cap it below 0.4, and the
    # fix is 0.4.4). Everything below 1.0.10 carries open advisories itself
    # (pip-audit, 2026-10-17).
    "langgraph>=1.2.3,<2",
    # Pinned directly, not left to langgraph's ranges: those still admit
    # vulnerable versions, and the nightly minimum-version leg resolves to
    # the lowest allowed. Floors are the first patched release of each.
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.4.4",
    # Also pinned for the original reason: `trazo.core.serialization`
    # needs pydantic-v2 message classes (`model_dump`), and langgraph's own
    # range has historically admitted much older langchain-core.
    "langchain-core>=1.4,<2",
]
crewai = [
    "crewai>=1.15,<2",
]
# Framework adapters are optional extras; each range is pinned to the
# major version verified against when its adapter task landed
# (TRZ-P2-04: langgraph 0.2.76; TRZ-P3-01: crewai 1.15.6). TRZ-P3-06's
# nightly `adapter-matrix` job (.github/workflows/nightly.yml) verifies
# both ranges' min and max install and pass on every run, so this comment
# doesn't need hand-updating as new patch releases land within the range.
demos = [
    # demos/research-assistant's vector memory (TRZ-P3-02). A dedicated
    # extra, not folded into `langgraph` — chromadb isn't LangGraph-
    # specific, and other demos may need it without needing an adapter.
    "chromadb>=1.1,<2",
]

[project.scripts]
trazo = "trazo.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trazo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Same protective bound as control-plane/pyproject.toml, applied here
# proactively rather than after a real SDK-side hang (see that file's
# comment for the incident that motivated it).
timeout = 60

[tool.mypy]
strict = true
# Not a relaxation of trazo's own 3.10 support (requires-python above, and
# ruff's target-version = "py310" at the repo root, are what actually gate
# that): with both framework extras installed, langgraph's langsmith
# dependency imports pytest in its normal (non-test) code, which — now
# that crewai's chromadb dependency pulls numpy into the venv for the
# first time — reaches numpy's own stub using Python 3.12+ ``type``
# statement syntax. Stub files are always fully parsed by mypy regardless
# of follow_imports, so a parse error there is fatal to the whole run
# unless python_version allows that syntax.
python_version = "3.12"
mypy_path = "src"
packages = ["trazo"]
