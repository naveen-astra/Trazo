[project]
name = "trazo-server"
version = "0.1.1"
description = "Trazo control plane: ingest, query, policy, and live-stream APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trazo maintainers" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "structlog>=24.1",
    "prometheus-client>=0.21",
    "redis>=5.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "anyio>=4.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trazo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# A run against real Postgres hung silently for 4+ hours in CI (no
# per-test output ever flushed under pytest's default stdout buffering,
# so the job gave no signal it was stuck until GitHub's own 6h job
# ceiling would've eventually killed it). This bounds any single test —
# most likely a lock-contention deadlock in the concurrent append_event
# test — to failing loudly instead.
timeout = 60

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["trazo_server"]
